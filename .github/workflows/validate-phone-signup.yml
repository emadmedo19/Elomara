name: Validate phone signup branch

on:
  push:
    branches:
      - migration/multi-tenant-isolation
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
