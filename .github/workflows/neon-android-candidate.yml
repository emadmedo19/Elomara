name: Build Neon Android candidate

on:
  workflow_run:
    workflows: [Deploy Neon backend]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: elomara-neon-android-candidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-android:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Neon tooling and configure candidate endpoints
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          npm ci --prefix neon
          node neon/scripts/runtime-config.mjs

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install image tools
        run: python -m pip install cairosvg pillow

      - name: Generate unified app branding assets
        run: python .github/scripts/generate_brand_assets.py

      - name: Install dependencies
        run: npm install

      - name: Verify native Neon session and candidate guards
        run: node --test tests/neonClient.test.mjs tests/otaUpdates.test.mjs
      - name: TypeScript check
        run: npm run lint

      - name: Test private signing persistence
        run: PYTHONDONTWRITEBYTECODE=1 python tests/test_android_signing.py

      - name: Build web app
        run: npm run build
        env:
          VITE_BUILD_ID: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore original private Android signing key from Neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          SIGNING_WORKDIR: ${{ runner.temp }}/elomara-android-signing
        run: node neon/scripts/download-signing.mjs

      - name: Verify restored private signing bundle and configure Gradle
        env:
          SIGNING_WORKDIR: ${{ runner.temp }}/elomara-android-signing
        run: python .github/scripts/prepare_android_signing.py

      - name: Build upgrade baseline and installable APK with the same stable key
        working-directory: android
        run: |
          set -euo pipefail
          bash ./gradlew assembleDebug -PelomaraVersionCode=$((1000 + GITHUB_RUN_NUMBER - 1))
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/elomara-upgrade-baseline.apk"
          bash ./gradlew assembleDebug

      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Verify Firebase initialization and app launch on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash .github/scripts/verify_android_upgrade.sh "$RUNNER_TEMP/elomara-upgrade-baseline.apk" android/app/build/outputs/apk/debug/app-debug.apk
            cd android && bash ./gradlew :app:connectedDebugAndroidTest

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-test-reports
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore

      - name: Print stable Android APK certificate fingerprints
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -E "certificate SHA-(1|256) digest"

      - name: Rename APK for download
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-apk/العمارة-Neon-اختبار.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: العمارة-Neon-اختبار-APK
          path: release-apk/العمارة-Neon-اختبار.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove private signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/elomara-android-signing"
