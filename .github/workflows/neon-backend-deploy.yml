name: Deploy Neon backend

on:
  push:
    branches: [main]
    paths: ['neon/functions/**', 'neon/package*.json', 'neon/tsconfig.json', 'neon/scripts/**', 'src/**', 'android/**', 'package*.json', 'vite.config.ts', '.github/workflows/neon-backend-deploy.yml', '.github/workflows/neon-android-candidate.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elomara-neon-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install backend tooling
        run: npm ci --prefix neon
      - name: Test migration guards
        run: npm test --prefix neon
      - name: Check backend TypeScript independently of the Android app
        run: npm run lint --prefix neon
      - name: Deploy backend and verify authentication boundaries
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node neon/scripts/deploy-backend.mjs
      - name: Save public endpoint configuration
        uses: actions/upload-artifact@v4
        with:
          name: neon-runtime
          path: neon-runtime.json
          if-no-files-found: error
