name: Build العمارة Android APK

on:
  push:
    branches:
      - main
      - migration/supabase-backend
      - ui-redesign-v2
      - feature/multi-tenant-buildings
      - fix/resident-mobile-layout-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install image tools
        run: python -m pip install cairosvg pillow

      - name: Generate unified app branding assets
        run: python .github/scripts/generate_brand_assets.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug

      - name: Print Android debug APK certificate SHA-1
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -i "certificate SHA-1 digest"

      - name: Rename APK for download
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-apk/العمارة.apk"

      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$TAG" "release-apk/العمارة.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "العمارة Android APK - ${GITHUB_RUN_NUMBER}" \
            --notes "Installable APK built from commit ${GITHUB_SHA}. This release asset is used instead of Actions artifacts to avoid the repository artifact storage quota."
