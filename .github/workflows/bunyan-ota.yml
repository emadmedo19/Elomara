name: Bunyan OTA

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://yvoylicirtdarroqcxoq.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_HKL0bzKI5Lf0M7v4YDXNcw_DIz9CAre' }}

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image tools
        run: python -m pip install cairosvg pillow

      - name: Generate unified app branding assets
        run: python .github/scripts/generate_brand_assets.py

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Package OTA bundle
        run: |
          set -euo pipefail
          mkdir -p ota-upload
          (cd dist && zip -qr "../ota-upload/${GITHUB_SHA}.zip" .)
          sha256sum "ota-upload/${GITHUB_SHA}.zip" | cut -d ' ' -f 1 > ota-upload/checksum.txt
          printf '{"bundleId":"%s","url":"https://yvoylicirtdarroqcxoq.supabase.co/storage/v1/object/public/bunyan-ota/bundles/%s.zip","checksum":"%s"}' "${GITHUB_SHA}" "${GITHUB_SHA}" "$(cat ota-upload/checksum.txt)" > ota-upload/latest.json

      - name: Upload bundle and manifest to Supabase Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing; refusing to report a successful OTA publish without uploading."
            exit 1
          fi

          upload_file() {
            local source_file="$1"
            local destination="$2"
            local content_type="$3"
            local response_file
            local http_code
            response_file="$(mktemp)"

            http_code="$(curl --silent --show-error --retry 2 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              "https://yvoylicirtdarroqcxoq.supabase.co/storage/v1/object/bunyan-ota/$destination" \
              --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              --header "Content-Type: $content_type" \
              --header "x-upsert: true" \
              --data-binary "@$source_file")"

            echo "Supabase Storage upload HTTP status: $http_code"
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::error::Supabase Storage rejected $destination (HTTP $http_code). Response:"
              # Print the server's diagnostic response only; never print request headers or secrets.
              cat "$response_file"
              rm -f "$response_file"
              return 1
            fi

            rm -f "$response_file"
            echo "Uploaded $destination successfully."
          }

          upload_file "ota-upload/${GITHUB_SHA}.zip" "bundles/${GITHUB_SHA}.zip" "application/zip"
          upload_file "ota-upload/latest.json" "latest.json" "application/json"

      - name: Announce curated app improvements once
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python .github/scripts/publish_release_notice.py

      - name: Clean up old OTA bundles safely
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = "https://yvoylicirtdarroqcxoq.supabase.co/storage/v1"
          bucket = "bunyan-ota"
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {"apikey": key, "Authorization": f"Bearer {key}", "Content-Type": "application/json"}

          def request(method, endpoint, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(base + endpoint, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)

          # The live manifest is authoritative, not the upload timestamp.
          req = urllib.request.Request(
              base + f"/object/public/{bucket}/latest.json",
              headers={"Cache-Control": "no-cache"},
          )
          with urllib.request.urlopen(req, timeout=45) as response:
              manifest = json.load(response)
          current = "bundles/" + manifest["bundleId"] + ".zip"
          if manifest["bundleId"] != os.environ["GITHUB_SHA"]:
              raise RuntimeError("Live OTA manifest does not match the just-published commit; skipping cleanup")

          objects = []
          offset = 0
          while True:
              page = request("POST", f"/object/list/{bucket}", {
                  "prefix": "bundles/", "limit": 100, "offset": offset,
                  "sortBy": {"column": "created_at", "order": "desc"}
              })
              objects.extend(obj for obj in page if obj.get("name", "").endswith(".zip"))
              if len(page) < 100:
                  break
              offset += 100

          # Keep the live release plus nine recent rollback versions.
          keep = {current}
          keep.update("bundles/" + obj["name"] if not obj["name"].startswith("bundles/") else obj["name"]
                      for obj in objects[:10])
          stale = ["bundles/" + obj["name"] if not obj["name"].startswith("bundles/") else obj["name"]
                   for obj in objects if ("bundles/" + obj["name"] if not obj["name"].startswith("bundles/") else obj["name"]) not in keep]
          print(f"OTA retention: {len(objects)} bundles, keeping {len(keep)}, removing {len(stale)} old bundles")
          if stale:
              request("DELETE", f"/object/{bucket}", {"prefixes": stale})
          PY
