name: Validate anonymous polls
on:
  push:
    branches:
      - feature/anonymous-polls
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "supabase/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-anonymous-polls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
