apply plugin: 'com.android.application'

// One signing identity for all distributed APKs; CI restores it from private storage.
def signingConfigPath = System.getenv('ELOMARA_SIGNING_CONFIG')
def stableSigning = signingConfigPath ? new groovy.json.JsonSlurper().parse(file(signingConfigPath)) : null
if (System.getenv('CI') && !stableSigning) {
    throw new GradleException('Stable Android signing is required in CI. Refusing a randomly signed APK.')
}
// Monotonic across the main and Neon candidate workflows, which have separate run counters.
def releaseVersionCode = System.getenv('CI') ? Math.floorDiv(System.currentTimeMillis(), 1000L).toInteger() : 1000 + (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def effectiveVersionCode = providers.gradleProperty('elomaraVersionCode').map { it.toInteger() }.getOrElse(releaseVersionCode)


// PushNotifications.register() uses the default Firebase app after login.
// Never publish an APK that compiles but crashes when that app is missing.
def googleServicesConfig = file('google-services.json')
if (googleServicesConfig.exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    throw new GradleException('android/app/google-services.json is required for Firebase push notifications. Refusing to build an APK without it.')
}

android {
    namespace = "app.bunyan.residential"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.bunyan.residential"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode effectiveVersionCode
        versionName "1.1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (stableSigning) {
            stable {
                storeFile file(stableSigning.storeFile)
                storePassword stableSigning.storePassword
                keyAlias stableSigning.keyAlias
                keyPassword stableSigning.keyPassword
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        debug {
            if (stableSigning) signingConfig signingConfigs.stable
        }
        release {
            if (stableSigning) signingConfig signingConfigs.stable
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.test.espresso:espresso-intents:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
